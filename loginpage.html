<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
    }

    .card {
      display: flex;
      width: 750px;
      min-height: 400px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      animation: slideUp 0.6s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── LEFT PANEL ── */
    .left {
      flex: 1;
      background: #fff;
      padding: 48px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .left h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #222;
      margin-bottom: 28px;
      letter-spacing: -0.5px;
    }

    .input-group {
      width: 100%;
      margin-bottom: 16px;
    }

    .input-group input {
      width: 100%;
      padding: 11px 16px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      color: #444;
      outline: none;
      transition: border-color 0.25s;
      background: #fafafa;
    }

    .input-group input:focus {
      border-color: #3dba7e;
      background: #fff;
    }

    .btn-signin {
      width: 100%;
      padding: 12px;
      background: #3dba7e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      letter-spacing: 0.3px;
      transition: background 0.2s, transform 0.15s;
    }

    .btn-signin:hover  { background: #35a86e; }
    .btn-signin:active { transform: scale(0.98); }

    .divider {
      font-size: 0.82rem;
      color: #aaa;
      margin: 18px 0 14px;
    }

    .socials {
      display: flex;
      gap: 12px;
    }

    .social-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, opacity 0.2s;
    }
    .social-btn:hover { transform: scale(1.1); opacity: 0.85; }

    .social-btn.fb  { background: #1877f2; }
    .social-btn.gl  { background: #ea4335; }
    .social-btn.li  { background: #0077b5; }

    .social-btn svg { width: 18px; height: 18px; fill: #fff; }

    /* ── RIGHT PANEL ── */
    .right {
      flex: 1;
      background: linear-gradient(145deg, #3dba7e 0%, #2da06a 100%);
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
    }

    .right h2 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 18px;
      letter-spacing: -0.3px;
    }

    .right p {
      font-size: 0.88rem;
      line-height: 1.7;
      color: rgba(255,255,255,0.88);
      max-width: 240px;
      margin-bottom: 28px;
    }

    .link-signup {
      font-size: 0.88rem;
      color: rgba(255,255,255,0.75);
    }

    .link-signup a {
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.5);
      padding-bottom: 1px;
      transition: border-color 0.2s;
    }
    .link-signup a:hover { border-color: #fff; }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .card { flex-direction: column; width: 94vw; }
      .right { padding: 36px 30px; }
    }
  </style>
</head>
<body>

<div class="card">

  <!-- LEFT: Sign In Form -->
  <div class="left">
    <h1>Signin</h1>

    <div class="input-group">
      <input type="text" placeholder="username" id="username" autocomplete="username"/>
    </div>

    <div class="input-group">
      <input type="password" placeholder="password" id="password" autocomplete="current-password"/>
    </div>

    <button class="btn-signin" onclick="handleSignin()">Signin</button>

    <p class="divider">or signin with</p>

    <div class="socials">
      <!-- Facebook -->
      <button class="social-btn fb" aria-label="Sign in with Facebook">
        <svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.56 9.87v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.88h-2.34v6.99A10 10 0 0 0 22 12z"/></svg>
      </button>
      <!-- Google -->
      <button class="social-btn gl" aria-label="Sign in with Google">
        <svg viewBox="0 0 24 24"><path d="M21.8 10.2H12v3.8h5.6c-.5 2.6-2.8 4.4-5.6 4.4a6.2 6.2 0 1 1 4-10.9l2.7-2.7A10 10 0 1 0 12 22c5.5 0 10-4.5 10-10 0-.6-.1-1.2-.2-1.8z"/></svg>
      </button>
      <!-- LinkedIn -->
      <button class="social-btn li" aria-label="Sign in with LinkedIn">
        <svg viewBox="0 0 24 24"><path d="M4.98 3.5A2.49 2.49 0 0 0 2.5 6c0 1.38 1.11 2.5 2.48 2.5h.02A2.49 2.49 0 0 0 7.48 6 2.49 2.49 0 0 0 4.98 3.5zM2.67 8.98H7.3V21H2.67V8.98zm7.2 0H14.4v1.66h.06c.63-1.19 2.16-2.44 4.45-2.44C23.07 8.2 24 11 24 15v6h-4.61v-5.32c0-1.27-.02-2.9-1.77-2.9-1.77 0-2.04 1.38-2.04 2.81V21H9.87V8.98z"/></svg>
      </button>
    </div>
  </div>

  <!-- RIGHT: Welcome Panel -->
  <div class="right">
    <h2>Welcome back!</h2>
    <p>Welcome back! We are so happy to have you here. It's great to see you again. We hope you had a safe and enjoyable time away.</p>
    <p class="link-signup">No account yet? <a href="#">Signup.</a></p>
  </div>

</div>

<script>
  function handleSignin() {
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();
    if (!user || !pass) {
      alert('Please fill in all fields.');
      return;
    }
    alert(`Welcome, ${user}! 🎉`);
  }

  // Allow Enter key to submit
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleSignin();
  });
</script>

</body>
</html>
